# Reusable workflow -- commit this to:
#   nebuladesignagency/.github/.github/workflows/publish-plugin.yml
#
# Each plugin repo calls it from its own .github/workflows/release.yml.
# Trust model: GitHub mints a short-lived OIDC token with aud=https://nebula.design/updates;
# the update server validates the JWT (issuer, audience, repo allowlist, tag ref, release event,
# iat/exp window) before accepting the zip.

name: Publish plugin to nebula.design

on:
  workflow_call:
    inputs:
      requires_wp:
        description: 'Minimum supported WordPress version'
        required: false
        default: '5.0'
        type: string
      tested_wp:
        description: 'Tested up to WordPress version'
        required: false
        default: '6.8.3'
        type: string
      requires_php:
        description: 'Minimum supported PHP version'
        required: false
        default: '7.4'
        type: string
      build_command:
        description: 'Optional build command (e.g. "npm ci && npm run build")'
        required: false
        default: ''
        type: string
      licence_publish_url:
        description: >
          Optional SECOND publish target (the licence server, e.g.
          https://licence.nebula.design/v1/publish). Empty means legacy-only,
          which is the default so plugins that have not cut over are untouched.
          When set, the release is published to BOTH: the legacy channel still
          serves every site on an older plugin build, while the licence server
          serves sites that have migrated. Both must keep receiving releases
          for the whole cutover, or one half of the fleet stops getting updates.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write          # required to mint the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Derive slug and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG_REF="${GITHUB_REF_NAME}"
          # Strip leading v or V so 'V1.2.3' and 'v1.2.3' both work.
          VERSION="${TAG_REF#[vV]}"
          SLUG="${GITHUB_REPOSITORY##*/}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([-+][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag '$TAG_REF' does not match a SemVer-ish 'v|VX.Y[.Z]' pattern."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Slug: $SLUG  Version: $VERSION"

      - name: Setup PHP (composer cache)
        if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Composer install (no dev)
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Run build command
        if: ${{ inputs.build_command != '' }}
        run: ${{ inputs.build_command }}

      - name: Stage and zip
        shell: bash
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"
          STAGING=".nebula-build"
          mkdir -p "$STAGING"
          # rsync into a folder whose name is exactly the slug -- the update server REJECTS
          # the publish if the zip top-level folder does not equal the slug, because that
          # would orphan WP installs. The staging dir name is chosen to NOT collide with
          # anything a plugin might have in its repo (no plugin has a top-level .nebula-build/).
          if [[ -f .distignore ]]; then
            rsync -a --delete --exclude-from=.distignore --exclude='/.git' --exclude="/$STAGING" ./ "$STAGING/${SLUG}/"
          else
            rsync -a --delete --exclude='/.git' --exclude="/$STAGING" --exclude='node_modules' --exclude='vendor/bin' --exclude='/tests' --exclude='*.md' ./ "$STAGING/${SLUG}/"
          fi
          cd "$STAGING"
          zip -qr "${SLUG}-${VERSION}.zip" "${SLUG}"
          sha256sum "${SLUG}-${VERSION}.zip" | awk '{print $1}' > "${SLUG}-${VERSION}.sha256"
          echo "Zip size: $(stat -c%s ${SLUG}-${VERSION}.zip) bytes"
          echo "SHA-256:  $(cat ${SLUG}-${VERSION}.sha256)"

      - name: Render changelog HTML
        id: changelog
        shell: bash
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          if [[ -f .github/render-changelog.sh ]]; then
            bash .github/render-changelog.sh > .nebula-build/changelog.html <<<"$RELEASE_BODY"
          else
            # Fallback: wrap the raw release body in <pre> so something always ships.
            printf '<pre>%s</pre>\n' "$(printf '%s' "$RELEASE_BODY" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')" > .nebula-build/changelog.html
          fi
          echo "Rendered $(wc -c < .nebula-build/changelog.html) bytes of changelog HTML."

      - name: Mint OIDC token
        id: tok
        uses: actions/github-script@v7
        with:
          script: |
            const tok = await core.getIDToken('https://nebula.design/updates');
            core.setSecret(tok);
            core.setOutput('token', tok);

      - name: Publish to nebula.design
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHA=$(cat ".nebula-build/${SLUG}-${VERSION}.sha256")
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -F "slug=${SLUG}" \
            -F "version=${VERSION}" \
            -F "zip_sha256=${SHA}" \
            -F "tested_wp=${{ inputs.tested_wp }}" \
            -F "requires_wp=${{ inputs.requires_wp }}" \
            -F "requires_php=${{ inputs.requires_php }}" \
            -F "changelog_html=<.nebula-build/changelog.html" \
            -F "zip=@.nebula-build/${SLUG}-${VERSION}.zip" \
            "https://nebula.design/updates/api/v1/publish"
          echo
          echo "Published ${SLUG} ${VERSION} to the legacy channel"

      # Second target, opt-in per plugin. Runs only when the caller passes
      # licence_publish_url, so plugins still on legacy-only are unaffected.
      #
      # Same OIDC token as above: the licence server's OIDC_AUDIENCE is also
      # 'https://nebula.design/updates'. That is a bare identifier the server
      # compares against, NOT a URL it calls, so it deliberately still names the
      # old host. Minting a second token with a different audience would fail
      # verification with 401 oidc_rejected.
      #
      # The field names differ from the legacy endpoint and are not
      # interchangeable: 'package' not 'zip', 'changelog' not 'changelog_html'.
      # requires_php / requires_wp / tested_up_to are NOT sent -- the licence
      # server reads them from the plugin file header inside the zip.
      #
      # always() so this still runs when the LEGACY publish failed. The two
      # channels are independent destinations, not a sequence: if the legacy
      # server is down, retired, or mid-maintenance, that is no reason to
      # withhold the release from the licence server as well. Without always(),
      # a legacy outage silently strands every migrated site on its current
      # version — which is exactly what happened to 1.14.5.
      #
      # The job still goes red if either publish failed, so a half-published
      # release is never mistaken for a clean one.
      - name: Publish to the licence server
        if: ${{ always() && inputs.licence_publish_url != '' }}
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.tok.outputs.token }}
          LICENCE_URL: ${{ inputs.licence_publish_url }}
        run: |
          set -euo pipefail
          SLUG="${{ steps.meta.outputs.slug }}"
          VERSION="${{ steps.meta.outputs.version }}"

          # Deliberately fails the job on error. A release that lands on one
          # channel and silently misses the other is the worst outcome: half the
          # fleet updates, nobody notices, and it surfaces weeks later as
          # "updates stopped working" on the other half.
          if ! curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -F "slug=${SLUG}" \
            -F "version=${VERSION}" \
            -F "channel=stable" \
            -F "changelog=<.nebula-build/changelog.html" \
            -F "package=@.nebula-build/${SLUG}-${VERSION}.zip" \
            "${LICENCE_URL}"; then
            echo
            echo "::error::Licence-server publish FAILED for ${SLUG} ${VERSION}."
            echo "::error::Check the legacy step above before re-running: if IT succeeded, a"
            echo "::error::re-run publishes to the legacy channel a second time. In that case fix"
            echo "::error::the licence server and publish this version from its admin panel by"
            echo "::error::hand. Only re-run the job when BOTH publishes failed."
            exit 1
          fi
          echo
          echo "Published ${SLUG} ${VERSION} to the licence server"
